name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Testcontainers uses the runner's Docker daemon to start Postgres.
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - name: Smoke test
        run: |
          for i in $(seq 30); do curl -fsS localhost:8080/health && break; sleep 2; done
          curl -fsS -X POST localhost:8080/payments \
            -H 'Content-Type: application/json' -H "Idempotency-Key: ci-$GITHUB_RUN_ID" \
            -d '{"amount":1299,"currency":"EUR","paymentMethod":"sim_ok"}' | grep -q '"status":"Succeeded"'
      - if: failure()
        run: docker compose logs
